spring.application.name=ApiGateway
server.port=8089

# ---------- Eureka ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# ---------- Logs de routage ----------
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# ---------- Swagger unifié ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=analysis-service
springdoc.swagger-ui.urls[0].url=/analysis/v3/api-docs
springdoc.swagger-ui.urls[1].name=certification-service
springdoc.swagger-ui.urls[1].url=/certification/v3/api-docs
springdoc.swagger-ui.urls[2].name=exam-content-service
springdoc.swagger-ui.urls[2].url=/exam-content/v3/api-docs
springdoc.swagger-ui.urls[3].name=feedback-service
springdoc.swagger-ui.urls[3].url=/feedback/v3/api-docs
springdoc.swagger-ui.urls[4].name=record-service
springdoc.swagger-ui.urls[4].url=/record/v3/api-docs
springdoc.swagger-ui.urls[5].name=simulation-service
springdoc.swagger-ui.urls[5].url=/simulation/v3/api-docs
springdoc.swagger-ui.urls[6].name=user-progress-service
springdoc.swagger-ui.urls[6].url=/user-progress/v3/api-docs

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info