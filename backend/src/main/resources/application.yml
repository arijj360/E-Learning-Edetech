server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # ---------- Documentation Swagger ----------
            - id: analysis-docs
              uri: lb://ANALYSIS-SERVICE
              predicates:
                - Path=/docs/analysis-service/v3/api-docs
              filters:
                - StripPrefix=2
            - id: certification-docs
              uri: lb://CERTIFICATION-SERVICE
              predicates:
                - Path=/docs/certification-service/v3/api-docs
              filters:
                - StripPrefix=2
            - id: exam-content-docs
              uri: lb://EXAM-CONTENT-SERVICE
              predicates:
                - Path=/docs/exam-content-service/v3/api-docs
              filters:
                - StripPrefix=2
            - id: feedback-docs
              uri: lb://FEEDBACK-SERVICE
              predicates:
                - Path=/docs/feedback-service/v3/api-docs
              filters:
                - StripPrefix=2
            - id: record-docs
              uri: lb://RECORD-SERVICE
              predicates:
                - Path=/docs/record-service/v3/api-docs
              filters:
                - StripPrefix=2
            - id: simulation-docs
              uri: lb://SIMULATION-SERVICE
              predicates:
                - Path=/docs/simulation-service/v3/api-docs
              filters:
                - StripPrefix=2
            - id: user-progress-docs
              uri: lb://USER-PROGRESS-SERVICE
              predicates:
                - Path=/docs/user-progress-service/v3/api-docs
              filters:
                - StripPrefix=2

            # ---------- API des services ----------
            - id: analysis-api
              uri: lb://ANALYSIS-SERVICE
              predicates:
                - Path=/analysis/**
              filters:
                - StripPrefix=1
            - id: certification-api
              uri: lb://CERTIFICATION-SERVICE
              predicates:
                - Path=/certification/**
              filters:
                - StripPrefix=1
            - id: exam-content-api
              uri: lb://EXAM-CONTENT-SERVICE
              predicates:
                - Path=/exam-content/**
              filters:
                - StripPrefix=1
            - id: feedback-api
              uri: lb://FEEDBACK-SERVICE
              predicates:
                - Path=/feedback/**
              filters:
                - StripPrefix=1
            - id: record-api
              uri: lb://RECORD-SERVICE
              predicates:
                - Path=/record/**
              filters:
                - StripPrefix=1
            - id: simulation-api
              uri: lb://SIMULATION-SERVICE
              predicates:
                - Path=/simulation/**
              filters:
                - StripPrefix=1
            - id: user-progress-api
              uri: lb://USER-PROGRESS-SERVICE
              predicates:
                - Path=/user-progress/**
              filters:
                - StripPrefix=1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: analysis-service
        url: /docs/analysis-service/v3/api-docs
      - name: certification-service
        url: /docs/certification-service/v3/api-docs
      - name: exam-content-service
        url: /docs/exam-content-service/v3/api-docs
      - name: feedback-service
        url: /docs/feedback-service/v3/api-docs
      - name: record-service
        url: /docs/record-service/v3/api-docs
      - name: simulation-service
        url: /docs/simulation-service/v3/api-docs
      - name: user-progress-service
        url: /docs/user-progress-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost